name: AzeezOS mod patch engine tests
on:
  push:
    branches: [azeezos-2.0]
    paths:
      - 'tools/mods/**'
      - '.github/workflows/azeezos-mod-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined tools/mods/patch_test.cpp -lz -o /tmp/mod-patch-test
          /tmp/mod-patch-test
      - name: Validate installer output and preservation
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined tools/mods/install_test.cpp -lz -o /tmp/mod-install-test
          /tmp/mod-install-test
