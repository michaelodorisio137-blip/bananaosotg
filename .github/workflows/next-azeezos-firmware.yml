name: Build AzeezOS Consolidated Test Firmware
on:
  workflow_dispatch:
  push:
    branches: [gb-gbc-goomba-viewport]
    paths:
      - '.github/workflows/next-azeezos-firmware.yml'
      - 'tools/consolidated-rootfs-patch.py'
permissions:
  contents: read
  actions: read

jobs:
  test-update:
    name: Build and verify native RG DS A/B OTA package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout custom firmware
        uses: actions/checkout@v4
      - name: Install native squashfs packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y squashfs-tools
      - name: Download verified firmware baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p base
          gh run download 45078908030 -R michaelodorisio137-blip/bananaosotg -n BananaOS-RGDS-USB-OTG -D base
          find base -type f -name 'banana-rgds-*.update.tar' -size +100M -print | tee /tmp/base-update
          test -s /tmp/base-update
      - name: Unpack original A/B firmware
        run: |
          mkdir original rootfs
          tar -xf "$(head -n 1 /tmp/base-update)" -C original
          find original -name rootfs.squashfs -type f | head -1 | tee /tmp/rootfs-path
          test -s /tmp/rootfs-path
          unsquashfs -d rootfs "$(cat /tmp/rootfs-path)"
          test -s rootfs/usr/lib/libretro/mgba_expanded_libretro.so
          test -s rootfs/usr/share/banana/themes/rgds-ds-classic.json
      - name: Apply validated custom changes
        run: |
          python3 tools/quick-gb-gbc-firmware-patch.py rootfs
          python3 tools/consolidated-rootfs-patch.py rootfs
          python3 tools/quick-gb-gbc-firmware-patch.py --verify rootfs
          sh -n rootfs/usr/libexec/banana/data-layout
          sh -n rootfs/usr/libexec/banana/run-retroarch
          sh -n rootfs/usr/libexec/banana/run-bananafront
          sh -n rootfs/usr/libexec/banana/update
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=Path('rootfs')
          themes=list((r/'usr/share/banana/themes').glob('rgds-ds-*.json'))
          assert len(themes)>=13, themes
          for p in themes: json.loads(p.read_text())
          s=(r/'usr/share/libretro/shaders/glsl/rgds/sharp-image-adjust.glslp').read_text()
          assert 'shaders = "2"' in s
          assert (r/'usr/share/libretro/shaders/glsl/misc/shaders/image-adjustment.glsl').is_file()
          assert (r/'usr/share/libretro/shaders/glsl/interpolation/shaders/sharp-bilinear-simple.glsl').is_file()
          print('PASS',len(themes),'DS themes, sharp-image-adjust shader, existing expanded GB/GBC')
          PY
      - name: Repack native update and verify checksums
        run: |
          set -eu
          ORIGINAL="$(dirname "$(head -n 1 /tmp/rootfs-path)")"
          rm -f "$ORIGINAL/rootfs.squashfs"
          mksquashfs rootfs "$ORIGINAL/rootfs.squashfs" -comp xz -b 131072 -noappend -processors 4 >/tmp/mksquashfs-next.log
          printf '0.5.3.7-azeez-next1\n' > "$ORIGINAL/VERSION"
          (cd "$ORIGINAL"; sha256sum Image *.dtb rootfs.squashfs > sha256sums)
          mkdir -p out
          tar -cf out/banana-rgds-0.5.3.7-azeez-next1.update.tar -C original "$(basename "$ORIGINAL")"
          (cd "$ORIGINAL"; sha256sum -c sha256sums)
          tar -tf out/*.update.tar | grep -q rootfs.squashfs
          sha256sum out/*.update.tar > out/SHA256SUMS.txt
          ls -lh out/*
      - name: Upload test firmware
        uses: actions/upload-artifact@v4
        with:
          name: AzeezOS-Next-Test-Firmware
          path: out/*
          compression-level: 0
          retention-days: 14
