name: Validate RG DS custom patches

on:
  push:
    paths:
      - 'apply.py'
      - 'rgds-audio-patch.py'
      - 'rgds-menu-patch.py'
      - 'rgds-eq-patch.py'
      - 'verify-preservation.py'
      - 'rgds-boot-patch.py'
      - 'rgds-filter-patch.py'
      - 'rgds-texfilter-patch.py'
      - 'rgds-superdrastic-3point.py'
      - 'rgds-system-filter-patch.py'
      - 'rgds-texture-patch.py'
      - 'rgds-analog-patch.py'
      - 'superdrastic-analog.patch'
      - 'rgds-cpad-patch.py'
      - 'rgds-mgba-viewport-patch.py'
      - 'rgds-mgba-viewport-source.py'
      - 'superdrastic-cpad.patch'
      - 'rgds-ds-classic.json'
      - 'usb-sd2'
      - '.github/workflows/validate-custom.yml'
  workflow_dispatch:

concurrency:
  group: rgds-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout modifications
        uses: actions/checkout@v4
      - name: Obtain upstream BananaOS
        run: git clone --depth=1 https://github.com/JorreFog/BananaLinux.git upstream
      - name: Validate Python scripts
        run: python3 -m py_compile apply.py rgds-audio-patch.py rgds-menu-patch.py rgds-eq-patch.py rgds-boot-patch.py rgds-filter-patch.py rgds-texture-patch.py rgds-system-filter-patch.py rgds-superdrastic-3point.py rgds-analog-patch.py rgds-cpad-patch.py rgds-mgba-viewport-patch.py rgds-mgba-viewport-source.py verify-preservation.py
      - name: Apply all RG DS modifications
        run: |
          python3 apply.py upstream
          python3 verify-preservation.py upstream
      - name: Syntax-check changed launcher scripts
        run: |
          sh -n upstream/system/rootfs/usr/libexec/banana/run-drastic
          sh -n upstream/system/rootfs/usr/libexec/banana/run-retroarch
          sh -n upstream/system/rootfs/usr/libexec/banana/run-bananafront
      - name: Generate and assemble native SuperDrastic three-point sampler
        run: |
          git init -q superdrastic
          git -C superdrastic remote add origin https://github.com/JorreFog/SuperDrastic.git
          git -C superdrastic fetch -q --depth 1 origin 425a416f69fc890c75d5717bae0c55dd040f4a97
          git -C superdrastic checkout -q FETCH_HEAD
          git -C superdrastic apply --check "$GITHUB_WORKSPACE/upstream/buildroot/patches/superdrastic/0002-rgds-right-analog-stylus.patch"
          git -C superdrastic apply "$GITHUB_WORKSPACE/upstream/buildroot/patches/superdrastic/0002-rgds-right-analog-stylus.patch"
          git -C superdrastic apply --check "$GITHUB_WORKSPACE/upstream/buildroot/patches/superdrastic/0003-rgds-cpad-guest-ram.patch"
          git -C superdrastic apply "$GITHUB_WORKSPACE/upstream/buildroot/patches/superdrastic/0003-rgds-cpad-guest-ram.patch"
          python3 rgds-superdrastic-3point.py superdrastic
          python3 -m py_compile superdrastic/src/rast/kerngen.py
          python3 superdrastic/src/rast/kerngen.py /tmp/rgds-rast-kern.S
          test -s /tmp/rgds-rast-kern.S
          if command -v clang >/dev/null; then clang --target=aarch64-linux-gnu -c /tmp/rgds-rast-kern.S -o /tmp/rgds-rast-kern.o; fi
      - name: Inspect expanded mGBA core transformation
        run: |
          git init -q mgba-test
          git -C mgba-test remote add origin https://github.com/libretro/mgba.git
          git -C mgba-test fetch -q --depth=1 origin 7a12d6d4b9acb14c0ae62c9166b6a2f3d08007f6
          git -C mgba-test checkout -q FETCH_HEAD
          python3 upstream/buildroot/package/libretro-mgba/rgds-mgba-viewport-source.py mgba-test
          grep -q 'GBA_VIDEO_HORIZONTAL_PIXELS = 320' mgba-test/include/mgba/gba/interface.h
          grep -q 'GBA_VIDEO_VERTICAL_PIXELS = 204' mgba-test/include/mgba/gba/interface.h
          grep -q 'uint16_t endX;' mgba-test/include/mgba/internal/gba/renderers/video-software.h
          grep -q 'VIDEO_WIDTH_MAX  320' mgba-test/src/platform/libretro/libretro.c
      - name: Check JSON menu document
        run: python3 -c 'import json; json.load(open("rgds-ds-classic.json"))'
      - name: Install host compilation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libdrm-dev libasound2-dev libfreetype-dev zlib1g-dev libssl-dev libcurl4-openssl-dev libssh2-1-dev libsmb2-dev libudev-dev
      - name: Syntax-check SuperDrastic analog SDL bridge
        run: |
          gcc -std=gnu11 -Wall -fsyntax-only $(pkg-config --cflags libdrm) superdrastic/src/dsflip.c
          # Bundled rcheevos headers are older than the Buildroot-provided version; allow only that preexisting declaration warning.
          gcc -std=gnu11 -Wall -Wno-error=implicit-function-declaration -fsyntax-only -Isuperdrastic/src -Isuperdrastic/src/third_party/rcheevos/include -Isuperdrastic/src/third_party/rcheevos/src superdrastic/src/ra.c
      - name: Syntax-check modified audio engine with ALSA enabled
        run: |
          g++ -std=c++17 -DBANANA_ALSA -Wall -fsyntax-only \
            -Iupstream/ui/src -Iupstream/ui -Iupstream/ui/rnds \
            $(pkg-config --cflags alsa freetype2 libdrm zlib) \
            upstream/ui/src/sound.cpp
      - name: Syntax-check menu and screenshot support
        run: |
          for f in layout.cpp library.cpp main.cpp splash.cpp settings.cpp; do
            g++ -std=c++17 -Wall -fsyntax-only \
              -Iupstream/ui/src -Iupstream/ui -Iupstream/ui/rnds \
              $(pkg-config --cflags freetype2 libdrm zlib) \
              "upstream/ui/src/$f"
          done
