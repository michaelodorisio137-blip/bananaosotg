name: Repair existing OTA checksum
on:
  push:
    branches: [azeezos-2.0]
    paths: ['.github/workflows/repair-ota-checksum.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: michaelodorisio137-blip/bananaosotg
      TAG: v0.5.3.9-gba-bitmap.1
      FILE: banana-rgds-0.5.3.9-gba-bitmap.1.update.tar
      EXPECTED: 77742250649578e5d5987113ca0a2a3d070024a9785b6039f6ff9faeeaa60f0a
    steps:
      - name: Verify original published firmware and repair only its checksum asset
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern "$FILE" --dir .
          gh release download "$TAG" --pattern SHA256SUMS-rgds.txt --dir .
          echo 'Original checksum file:'
          cat SHA256SUMS-rgds.txt
          printf '%s  %s\n' "$EXPECTED" "$FILE" | sha256sum -c -
          sha256sum "$FILE" > SHA256SUMS-rgds.txt
          grep -Ex "[0-9a-f]{64}  $FILE" SHA256SUMS-rgds.txt
          gh release upload "$TAG" SHA256SUMS-rgds.txt --clobber
          mkdir verify
          gh release download "$TAG" --pattern SHA256SUMS-rgds.txt --dir verify
          cmp SHA256SUMS-rgds.txt verify/SHA256SUMS-rgds.txt
          sha256sum -c verify/SHA256SUMS-rgds.txt
          echo 'Repaired existing checksum only; firmware unchanged.'
