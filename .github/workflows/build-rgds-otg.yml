name: Build RG DS BananaOS with USB OTG storage

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-rgds-otg.yml'
      - 'apply.py'
      - 'rgds-bananafront-shoulders.py'
      - 'usb-sd2'
      - 'rgds-audio-patch.py'
      - 'rgds-menu-patch.py'
      - 'rgds-eq-patch.py'
      - 'rgds-boot-patch.py'
      - 'rgds-filter-patch.py'
      - 'rgds-texfilter-patch.py'
      - 'rgds-superdrastic-3point.py'
      - 'rgds-system-filter-patch.py'
      - 'rgds-texture-patch.py'
      - 'rgds-analog-patch.py'
      - 'superdrastic-analog.patch'
      - 'rgds-cpad-patch.py'
      - 'rgds-mgba-viewport-patch.py'
      - 'rgds-mgba-viewport-source.py'
      - 'superdrastic-cpad.patch'
      - 'rgds-ds-classic.json'
      - 'verify-preservation.py'

concurrency:
  group: rgds-firmware-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BR2_DL_DIR: ${{ github.workspace }}/dl
    steps:
      - name: Checkout patch source
        uses: actions/checkout@v4

      - name: Free disk space for Buildroot
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Install upstream build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev unzip rsync cpio file wget python3-dev swig libgnutls28-dev

      - name: Validate patch scripts
        run: |
          python3 -m py_compile apply.py rgds-audio-patch.py rgds-menu-patch.py rgds-eq-patch.py rgds-boot-patch.py rgds-filter-patch.py rgds-texture-patch.py rgds-system-filter-patch.py rgds-superdrastic-3point.py rgds-analog-patch.py rgds-cpad-patch.py rgds-mgba-viewport-patch.py rgds-mgba-viewport-source.py rgds-bananafront-shoulders.py verify-preservation.py
          sh -n usb-sd2

      # actions/checkout uses authenticated GitHub API/git transport and can
      # avoid transient unauthenticated git-clone HTTP 403 failures.
      - name: Checkout BananaOS upstream
        uses: actions/checkout@v4
        with:
          repository: JorreFog/BananaLinux
          ref: main
          path: BananaLinux
          fetch-depth: 1
          persist-credentials: false

      - name: Record BananaOS revision
        run: git -C BananaLinux rev-parse HEAD | tee upstream-commit.txt

      - name: Apply USB storage integration
        run: |
          python3 apply.py BananaLinux
          python3 verify-preservation.py BananaLinux
          sh -n BananaLinux/system/rootfs/usr/libexec/banana/usb-sd2
          sh -n BananaLinux/system/rootfs/usr/libexec/banana/sd2
          sh -n BananaLinux/system/rootfs/etc/init.d/rcS
          git -C BananaLinux diff --check
          git -C BananaLinux status --short
          grep -n 'USB drive label' BananaLinux/ui/src/fileops.cpp

      - name: Restore downloads cache
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: otg-dl-${{ hashFiles('apply.py', 'usb-sd2') }}
          restore-keys: otg-dl-

      - name: Compile RG DS image
        run: make -C BananaLinux rgds

      - name: Save download cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dl
          key: otg-dl-${{ github.run_id }}

      - name: Validate firmware image
        run: |
          test -s BananaLinux/output/rgds/images/banana-rgds.img.gz
          gzip -t BananaLinux/output/rgds/images/banana-rgds.img.gz
          sha256sum BananaLinux/output/rgds/images/banana-rgds.img.gz > SHA256SUMS.txt

      - name: Upload firmware image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BananaOS-RGDS-USB-OTG
          retention-days: 7
          compression-level: 0
          path: |
            BananaLinux/output/rgds/images/banana-rgds.img.gz
            BananaLinux/output/rgds/images/banana-rgds-*.update.tar
            SHA256SUMS.txt
            upstream-commit.txt

      - name: Diagnostic listing on failure
        if: failure()
        run: |
          df -h /
          ls -lah BananaLinux/output/rgds/images/ 2>/dev/null || true
          ls -t BananaLinux/output/rgds/build 2>/dev/null | head -20 || true
