name: AzeezOS AI cheat engine tests
on:
  push:
    branches: [azeezos-2.0]
    paths:
      - 'tools/ai-cheats/**'
      - '.github/workflows/azeezos-ai-cheat-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ram-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run memory search tests
        run: |
          printf '#include "ram_scan.h"\n' | g++ -std=c++17 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -DAZEEZ_RAM_SCAN_SELFTEST -Itools/ai-cheats -x c++ - -o /tmp/azeez-ram-scan
          /tmp/azeez-ram-scan
      - name: Compile and run live transport tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined tools/ai-cheats/live_scan_test.cpp -o /tmp/azeez-live-scan
          /tmp/azeez-live-scan
      - name: Compile and run cheat trial tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined tools/ai-cheats/trial_test.cpp -o /tmp/azeez-trial
          /tmp/azeez-trial
      - name: Compile and run persistent catalog tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined tools/ai-cheats/catalog_test.cpp -o /tmp/azeez-catalog
          /tmp/azeez-catalog
