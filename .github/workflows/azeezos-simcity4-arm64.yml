name: SimCity 4 native ARM64 bring-up
on:
  workflow_dispatch:
  push:
    branches: [azeezos-2.0]
    paths:
      - 'tools/simcity4/**'
      - '.github/workflows/azeezos-simcity4-arm64.yml'
permissions:
  contents: read
jobs:
  compile-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev libc++abi-dev cmake ninja-build libepoxy-dev libfreetype-dev libpng-dev libmpg123-dev xxd libgl1-mesa-dev libegl1-mesa-dev libdrm-dev libgbm-dev libudev-dev libasound2-dev pkg-config
          git clone --depth 1 --branch release-3.2.28 https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF -DSDL_KMSDRM=ON
          cmake --build /tmp/sdl-build -j 4
          sudo cmake --install /tmp/sdl-build
          sudo ldconfig
      - name: Fetch pinned native engine
        run: |
          git clone https://github.com/codingncaffeine/Open-City-Builder.git engine
          git -C engine checkout --detach 6d46a1f76a57fbe0e1b9241f16fc4bea49b138c7
          python3 tools/simcity4/patch-engine.py engine
          python3 -m py_compile tools/simcity4/prepare-profile.py
          sh -n tools/simcity4/launch-test.sh
      - name: Build native engine
        run: |
          export PKG_CONFIG_PATH=/usr/local/lib/aarch64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}
          JOBS=4 bash engine/native/scripts/build_linux_game.sh
          file engine/bin/sc4_game_linux
          readelf -h engine/bin/sc4_game_linux | grep -q AArch64
          ldd engine/bin/sc4_game_linux | tee dependencies.txt
          ! grep -q 'not found' dependencies.txt
      - name: Archive ARM64 Linux reference build and source
        run: |
          mkdir -p out
          cp engine/bin/sc4_game_linux dependencies.txt out/
          cp tools/simcity4/{README.md,prepare-profile.py,launch-test.sh} out/
          git -C engine diff > out/rgds-touch.patch
          git -C engine archive --format=tar.gz -o "$PWD/out/upstream-source.tar.gz" HEAD
          sha256sum out/sc4_game_linux > out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: simcity4-arm64-linux-reference-NOT-RGDS-OTA
          path: out
