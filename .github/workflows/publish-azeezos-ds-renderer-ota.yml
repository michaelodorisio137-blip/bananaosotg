name: Package and publish verified DS renderer OTA
on:
  push:
    branches: [azeezos-2.0]
    paths: ['.github/workflows/publish-azeezos-ds-renderer-ota.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: azeezos-2-ota-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: michaelodorisio137-blip/bananaosotg
      BASE_RUN: '46055572166'
      BASE_VERSION: 2.0.0-dev.46055572166
      BASE_SHA: 73ed1c154ce0c3802975877a9f3688236f291ed2
      BUILD_RUN: '46061772616'
      BUILD_SHA: 2ffcf8104f159ca89b18507792e21f28bf713a90
      VALIDATION_SHA: 77a4fce2041e1f0495763d607a9cd9f0d8d50265
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source provenance and download exact successful builds
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$BUILD_SHA" HEAD -- tools ':!tools/gpu-launch-session.py'
          git diff --exit-code "$VALIDATION_SHA" "$BUILD_SHA" -- tools/azeezos-2-ds-expanded.py tools/azeezos-2-bananads-filter.py
          git diff --name-only "$BASE_SHA" "$BUILD_SHA" -- tools | sort > /tmp/actual-diff
          printf '%s\n' tools/azeezos-2-ds-expanded.py tools/azeezos-2-native-integer.py | sort > /tmp/expected-diff
          diff -u /tmp/expected-diff /tmp/actual-diff
          for spec in "$BASE_RUN:$BASE_SHA" "$BUILD_RUN:$BUILD_SHA" "46061772637:$BUILD_SHA" "46061758622:$VALIDATION_SHA"; do
            gh api "repos/$GH_REPO/actions/runs/${spec%:*}" --jq '.conclusion + " " + .head_sha' | grep -Fx "success ${spec#*:}"
          done
          mkdir -p base components original out
          gh run download "$BASE_RUN" -n AzeezOS-DS-Renderer-OTA -D base
          gh run download "$BUILD_RUN" -n "AzeezOS-Component-Binaries-$BUILD_RUN" -D components
          test "$(cat components/SOURCE-COMMIT)" = "$BUILD_SHA"
          (cd base; sha256sum -c SHA256SUMS-rgds.txt)
          (cd components; sha256sum -c SHA256SUMS)
          for bin in components/usr/bin/banana-ui components/usr/bin/bananads; do
            test -s "$bin"
            readelf -h "$bin" | grep -q AArch64
          done
          tar -xf "base/banana-rgds-$BASE_VERSION.update.tar" -C original
          mapfile -t roots < <(find original -type f -name rootfs.squashfs)
          test "${#roots[@]}" -eq 1
          dir=$(dirname "${roots[0]}")
          test "$(cat "$dir/board")" = rgds
          test "$(cat "$dir/VERSION")" = "$BASE_VERSION"
          (cd "$dir"; sha256sum -c sha256sums)
          printf '%s\n' "$dir" > /tmp/ota-dir
      - name: Preserve the DS renderer and repair Saturn and PSP GPU launch sessions
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y squashfs-tools
          dir=$(cat /tmp/ota-dir)
          unsquashfs -d rootfs "$dir/rootfs.squashfs"
          test "$(cat rootfs/etc/banana/version)" = "$BASE_VERSION"
          install -m 0755 components/usr/bin/bananads rootfs/usr/bin/bananads
          install -m 0755 components/usr/bin/banana-ui rootfs/usr/bin/banana-ui
          python3 tools/gpu-launch-session.py rootfs
          for core in yabasanshiro ppsspp_azeez; do
            binary="rootfs/usr/lib/libretro/${core}_libretro.so"
            readelf -h "$binary" | grep -q AArch64
            while IFS= read -r needed; do
              if ! find rootfs/lib rootfs/usr/lib -name "$needed" -print -quit | grep -q .; then
                echo "Missing runtime library: $core -> $needed" >&2
                exit 1
              fi
            done < <(readelf -d "$binary" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p')
          done
          test -s rootfs/usr/share/banana/PPSSPP/compat.ini
          sh -n rootfs/usr/libexec/banana/run-bananads
          cmp components/usr/bin/bananads rootfs/usr/bin/bananads
          cmp components/usr/bin/banana-ui rootfs/usr/bin/banana-ui
          strings rootfs/usr/bin/bananads > /tmp/ds-strings
          strings rootfs/usr/bin/banana-ui > /tmp/ui-strings
          grep -Fq 'DS 3D requested scale=' /tmp/ds-strings
          grep -Fq 'expanded 3D raster:' /tmp/ds-strings
          grep -Fq 'render.expanded_scale' /tmp/ds-strings
          grep -Fq 'Expanded 3D resolution' /tmp/ui-strings
          grep -Fq '320x240 (Native)' /tmp/ui-strings
          grep -Fq '640x480 (HD)' /tmp/ui-strings
          VERSION="2.0.0-dev.$GITHUB_RUN_ID"
          printf '%s\n' "$VERSION" > rootfs/etc/banana/version
          printf '%s\n' "$VERSION" > "$dir/VERSION"
          rm "$dir/rootfs.squashfs"
          mksquashfs rootfs "$dir/rootfs.squashfs" -comp xz -b 131072 -noappend -processors 4
          test "$(unsquashfs -cat "$dir/rootfs.squashfs" etc/banana/version)" = "$VERSION"
          (cd "$dir"; sha256sum Image *.dtb rootfs.squashfs > sha256sums; sha256sum -c sha256sums)
          tar -cf "out/banana-rgds-$VERSION.update.tar" -C original "$(basename "$dir")"
          (cd out; sha256sum *.update.tar > SHA256SUMS-rgds.txt; sha256sum -c SHA256SUMS-rgds.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: AzeezOS-DS-Renderer-OTA
          path: out/*
          compression-level: 0
          if-no-files-found: error
      - name: Publish checksum-verified development OTA
        shell: bash
        run: |
          set -euo pipefail
          VERSION="2.0.0-dev.$GITHUB_RUN_ID"
          FILE="banana-rgds-$VERSION.update.tar"
          TAG="v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "out/$FILE" out/SHA256SUMS-rgds.txt --target "$GITHUB_SHA" --title "AzeezOS RG DS 2.0 GPU launch repair preview" --notes "Preserves the existing DS renderer and all emulator binaries; isolates Saturn and PSP hardware launch sessions from shared CRT, scaling, and frontend settings. Checks packaged cores, runtime library names and PSP assets. Physical hardware launch and performance remain unverified. Prior OTA preserved." --prerelease --draft
          fi
          mkdir -p verify
          gh release download "$TAG" --pattern "$FILE" --pattern SHA256SUMS-rgds.txt --dir verify
          cmp "out/$FILE" "verify/$FILE"
          cmp out/SHA256SUMS-rgds.txt verify/SHA256SUMS-rgds.txt
          (cd verify; sha256sum -c SHA256SUMS-rgds.txt)
          gh release edit "$TAG" --draft=false --prerelease
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets,url
